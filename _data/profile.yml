short_bio: >-
  <p>
    I am an undergraduate student in the Talented Program in Computer Science at
    <a href="https://hust.edu.vn/" target="_blank">Hanoi University of Science and Technology (HUST)</a>,
    and an AI Researcher at VinMotion.
    I previously worked as an AI Resident Researcher at FPT Software AI Center.
  </p>
  <p>
    My research interests include Large Language Models, Vision-Language-Action models,
    Embodied AI, Humanoid Robotics, Evolutionary Computation, Automated Algorithm Design,
    Combinatorial Optimization, and AI for Software Engineering.
  </p>

