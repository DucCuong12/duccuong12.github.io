<div class="mt-3 d-md-none"></div>
<div class="row">
    <div class="col">
        <div class="panel">
            <div class="panel-head">
                <h3 class="panel-title">About Me</h3>
            </div>
            <div class="px-4 py-3">
                <div class="text-profile-bio mt-0" {% if site.data.profile.short_bio_text_justify %}style="text-align: justify;"{% endif %}>
                    {{ site.data.profile.short_bio }}
                </div>
                {% if site.data.profile.cv_link %}
                    <a class="pub-link mt-2 d-inline-block" target="_blank" href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt"></i> Curriculum Vitae</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
