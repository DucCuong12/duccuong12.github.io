{% assign publications = include.publications %}
<div class="panel my-4">
    <div class="panel-head">
        <h3 class="panel-title">{% if include.title %}{{ include.title }}{% else %}Selected Publications{% endif %}</h3>
        <a class="panel-link" href="{{ 'publications' | relative_url }}">View all →</a>
    </div>
    {% for item in publications limit:include.limit %}
        {% include widgets/publication_item.html item=item hide_bottom_border=forloop.last %}
    {% endfor %}
</div>
